{% extends 'core/base.html' %}
{% block title %}Are you sure? - Haat{% endblock %}

{% block content %}
<div class="form-box" style="text-align:center;">
    <h2 class="section-title" style="margin-top:0;">Are you sure?</h2>
    <p style="margin-bottom:18px;">{{ message }}</p>
    <form method="POST">
        {% csrf_token %}
        {% if not disable_confirm %}<button type="submit" class="btn btn-danger">Yes, delete</button>{% endif %}
        <a class="btn btn-ghost" href="{{ cancel_url }}">{% if disable_confirm %}Back{% else %}Cancel{% endif %}</a>
    </form>
</div>
{% endblock %}
