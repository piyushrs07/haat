{% extends 'core/base.html' %}
{% block title %}Seller Login - Haat{% endblock %}

{% block content %}
<div class="form-box">
    <h2 class="section-title" style="margin-top:0;">Seller Login</h2>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="POST">
        {% csrf_token %}
        <label for="f-email">Email</label>
        <input id="f-email" type="email" name="email" autocomplete="email" autocapitalize="none" required>

        <label for="f-password">Password</label>
        <input id="f-password" type="password" name="password" autocomplete="current-password" required>

        <button type="submit" class="btn" style="width:100%;">Login</button>
    </form>
    <p style="margin-top:14px;">Want to sell on Haat? <a href="/register/seller/">Register your shop</a></p>
</div>
{% endblock %}
