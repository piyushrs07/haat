{% extends 'core/base.html' %}
{% block title %}Join Haat{% endblock %}

{% block content %}
<div class="form-box">
    <h2 class="section-title" style="margin-top:0;">Create Your Account</h2>
    {% if error %}<p class="error">{{ error }} <a href="/login/customer/">Go to login</a></p>{% endif %}
    <form method="POST">
        {% csrf_token %}
        <label>Full Name</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <label>Phone</label>
        <input type="text" name="phone" required>

        <label>Address</label>
        <textarea name="address" rows="3" required></textarea>

        <button type="submit" class="btn" style="width:100%;">Register</button>
    </form>
    <p style="margin-top:14px;">Already have an account? <a href="/login/customer/">Login</a></p>
</div>
{% endblock %}
