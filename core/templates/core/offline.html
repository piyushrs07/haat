<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e76f51">
<title>Offline - Haat</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
       font-family:'Segoe UI',Arial,sans-serif;background:#fdf6ee;color:#2b2b2b;padding:24px;box-sizing:border-box}
  .box{max-width:360px}
  h1{color:#264653;margin:12px 0 8px}
  p{opacity:.8;line-height:1.5}
  button{margin-top:18px;background:#e76f51;color:#fff;border:0;border-radius:8px;padding:12px 24px;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <div style="font-size:3rem" aria-hidden="true">📡</div>
  <h1>You're offline</h1>
  <p>Haat needs an internet connection to show products and orders. Check your connection and try again.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
