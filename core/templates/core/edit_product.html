{% extends 'core/base.html' %}
{% block title %}Edit Product - Haat{% endblock %}

{% block content %}
<div class="form-box">
    <h2 class="section-title" style="margin-top:0;">Edit Product</h2>

    {% if product.photo %}
        <img src="{{ product.photo.url }}" alt="{{ product.name }}" style="width:100%; max-height:200px; object-fit:cover; border-radius:8px; margin-bottom:14px;">
    {% endif %}

    {% if product.images.all %}
        <div style="display:flex; gap:8px; overflow-x:auto; margin-bottom:14px;">
            {% for img in product.images.all %}
                <img src="{{ img.image.url }}" alt="Extra photo" style="width:70px; height:70px; object-fit:cover; border-radius:6px; flex-shrink:0;">
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label>Product Name</label>
        <input type="text" name="name" value="{{ product.name }}" required>

        <label>Description</label>
        <textarea name="description" rows="4" required>{{ product.description }}</textarea>

        <label>Price (₹)</label>
        <input type="number" step="0.01" name="price" value="{{ product.price }}" required>

        <label>Category</label>
        <input type="text" name="category" value="{{ product.category }}" required>

        <label>Replace Main Photo (leave empty to keep current)</label>
        <input type="file" name="photo" accept="image/*" capture="environment">

        <label>Add More Photos (optional)</label>
        <input type="file" name="images" accept="image/*" capture="environment" multiple>

        <button type="submit" class="btn" style="width:100%;">Save Changes</button>
    </form>
</div>
{% endblock %}
