{% extends 'core/base.html' %}
{% block title %}Edit Product - Haat{% endblock %}

{% block content %}
<div class="form-box">
    <h2 class="section-title" style="margin-top:0;">Edit Product</h2>

    {% if product.photo %}
        <img src="{{ product.photo.url }}" alt="{{ product.name }}" onerror="this.remove()" style="width:100%; max-height:220px; object-fit:cover; border-radius:8px; margin-bottom:14px;">
    {% endif %}

    {% if product.images.all %}
        <div class="gallery-edit">
            {% for img in product.images.all %}
                <div class="gallery-item">
                    <img src="{{ img.image.url }}" alt="Extra photo" onerror="this.parentNode.remove()">
                    <form method="POST" action="/seller/product-image/delete/{{ img.id }}/">
                        {% csrf_token %}
                        <button type="submit" class="gallery-x" title="Remove this photo">×</button>
                    </form>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label>Product Name</label>
        <input type="text" name="name" value="{{ product.name }}" required>

        <label>Description</label>
        <textarea name="description" rows="4" required>{{ product.description }}</textarea>

        <label>Price (₹)</label>
        <input type="number" step="0.01" name="price" value="{{ product.price }}" required>

        <label>Category</label>
        <input type="text" name="category" value="{{ product.category }}" required>

        <label>Replace Main Photo (leave empty to keep current)</label>
        <div class="upload-buttons">
            <label class="upload-btn">🖼️ Choose from Gallery
                <input type="file" name="photo" accept="image/*" data-preview="main-preview" hidden>
            </label>
            <label class="upload-btn">📷 Take Photo
                <input type="file" name="photo_camera" accept="image/*" capture="environment" data-preview="main-preview" hidden>
            </label>
        </div>
        <div id="main-preview" class="preview-row"></div>

        <label>Add More Photos (optional)</label>
        <div class="upload-buttons">
            <label class="upload-btn">🖼️ Choose from Gallery
                <input type="file" name="images" accept="image/*" multiple data-preview="extra-preview" hidden>
            </label>
            <label class="upload-btn">📷 Take Photo
                <input type="file" name="images_camera" accept="image/*" capture="environment" data-preview="extra-preview" hidden>
            </label>
        </div>
        <div id="extra-preview" class="preview-row"></div>

        <button type="submit" class="btn" style="width:100%;">Save Changes</button>
    </form>
</div>
{% endblock %}
