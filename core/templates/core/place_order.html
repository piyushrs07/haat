{% extends 'core/base.html' %}
{% block title %}Place Order - Haat{% endblock %}

{% block content %}
<div class="form-box">
    <h2 class="section-title" style="margin-top:0;">Place Your Order</h2>

    <div class="summary-box">
        <strong>{{ product.name }}</strong><br>
        <span class="price">₹{{ product.price }}</span><br>
        <span class="seller-line">Sold by {{ product.seller.shop_name }}</span>
    </div>

    {% include 'core/_errors.html' %}

    <form method="POST">
        {% csrf_token %}
        <label for="qty">Quantity</label>
        <input id="qty" type="number" inputmode="numeric" name="quantity" value="{{ form.quantity }}" min="1" max="100" required>

        <label for="distance_zone">Delivery Distance</label>
        <select name="distance_zone" id="distance_zone" required>
            <option value="near" {% if form.distance_zone == 'near' %}selected{% endif %}>Nearby (0-3 km) - No extra charge</option>
            <option value="medium" {% if form.distance_zone == 'medium' %}selected{% endif %}>Medium (3-8 km) - ₹30 delivery charge</option>
            <option value="far" {% if form.distance_zone == 'far' %}selected{% endif %}>Far (8+ km) - ₹60 delivery charge</option>
        </select>

        <p id="delivery-estimate" class="estimate"></p>

        <label for="payment_method">Payment Method</label>
        <select name="payment_method" id="payment_method" required>
            <option value="online" {% if form.payment_method == 'online' %}selected{% endif %}>Online</option>
            <option value="offline" {% if form.payment_method == 'offline' %}selected{% endif %}>Offline (pay on delivery)</option>
        </select>

        <label for="addr">Delivery Address</label>
        <textarea id="addr" name="delivery_address" rows="3" maxlength="500" autocomplete="street-address" required>{{ form.delivery_address }}</textarea>

        <button type="submit" class="btn" style="width:100%;">Place Order</button>
    </form>
</div>

<script>
(function () {
    var select = document.getElementById('distance_zone');
    var out = document.getElementById('delivery-estimate');
    var daysMap = { near: 1, medium: 3, far: 5 };
    function update() {
        var d = new Date();
        d.setDate(d.getDate() + (daysMap[select.value] || 3));
        out.textContent = 'Estimated delivery by ' +
            d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
    }
    select.addEventListener('change', update);
    update();
})();
</script>
{% endblock %}
