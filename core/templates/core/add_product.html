{% extends 'core/base.html' %}
{% block title %}Add Product - Haat{% endblock %}

{% block content %}
<div class="form-box">
    <h2 class="section-title" style="margin-top:0;">Add a New Product</h2>
    {% include 'core/_errors.html' %}
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="p-name">Product Name</label>
        <input id="p-name" type="text" name="name" value="{{ form.name }}" maxlength="150" required>

        <label for="p-desc">Description</label>
        <textarea id="p-desc" name="description" rows="4" maxlength="5000" required>{{ form.description }}</textarea>

        <label for="p-price">Price (₹)</label>
        <input id="p-price" type="number" inputmode="decimal" step="0.01" min="0.01" name="price" value="{{ form.price }}" required>

        <label for="p-cat">Category</label>
        <input id="p-cat" type="text" name="category" value="{{ form.category }}" maxlength="100" required>

        <label>Main Product Photo</label>
        <div class="upload-buttons">
            <label class="upload-btn">🖼️ Choose from Gallery
                <input type="file" name="photo" accept="image/*" data-preview="main-preview" hidden>
            </label>
            <label class="upload-btn">📷 Take Photo
                <input type="file" name="photo_camera" accept="image/*" capture="environment" data-preview="main-preview" hidden>
            </label>
        </div>
        <div id="main-preview" class="preview-row"></div>

        <label>Additional Photos (optional)</label>
        <div class="upload-buttons">
            <label class="upload-btn">🖼️ Choose from Gallery
                <input type="file" name="images" accept="image/*" multiple data-preview="extra-preview" hidden>
            </label>
            <label class="upload-btn">📷 Take Photo
                <input type="file" name="images_camera" accept="image/*" capture="environment" data-preview="extra-preview" hidden>
            </label>
        </div>
        <div id="extra-preview" class="preview-row"></div>

        <button type="submit" class="btn" style="width:100%;">Add Product</button>
    </form>
</div>
{% endblock %}
