{% extends 'core/base.html' %}
{% block title %}Verify Email - Haat{% endblock %}

{% block content %}
<div class="form-box" style="text-align:center;">
    <span class="step-icon">✉️</span>
    <h2 class="section-title" style="margin-top:0;">Verify Your Email</h2>
    <p style="color:#555; margin-bottom:20px;">We sent a 6-digit code to <strong>{{ email }}</strong>.<br>
    <small>Can't see it? Check your Spam or Promotions folder.</small></p>

    <form method="POST">
        {% csrf_token %}
        <label for="otp">Enter Code</label>
        <input id="otp" type="text" name="otp" maxlength="6" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}"
               style="text-align:center; font-size:1.4rem; letter-spacing:6px;">
        <button type="submit" class="btn" style="width:100%;">Verify</button>
    </form>

    <form method="POST" action="{% if role == 'seller' %}{% url 'resend_seller_otp' %}{% else %}{% url 'resend_customer_otp' %}{% endif %}" style="margin-top:16px;">
        {% csrf_token %}
        <button type="submit" class="link-btn">Resend Code</button>
    </form>
</div>
{% endblock %}
